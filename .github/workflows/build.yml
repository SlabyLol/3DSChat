name: Build 3DS Chat

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build .3dsx
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3ds-chat.3dsx
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-chat
          path: 3ds-chat.3dsx
          if-no-files-found: error

      - name: Create Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 3ds-chat.3dsx
          generate_release_notes: true
          body: |
            ## 🎮 3DS Chat Server ${{ github.ref_name }}

            ### Installation
            1. `3ds-chat.3dsx` herunterladen
            2. Auf SD-Karte kopieren: `/3ds/3ds-chat/3ds-chat.3dsx`
            3. Homebrew Launcher starten → App auswählen

            ### Benutzen
            - App starten → IP auf dem oberen Bildschirm ablesen
            - Browser öffnen: `http://<3DS-IP>:7496`
            - Chatten! 🎉
